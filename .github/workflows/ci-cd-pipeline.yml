name: CI/CD (Yandex Cloud)

on:
  push:
    branches: [week*]

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml
    strategy:
      fail-fast: false
      matrix:
        service: [back, front]
    with:
      service: ${{ matrix.service }}

  security-scan:
    uses: ./.github/workflows/sast-sca.yml

  build:
    needs: [checks, security-scan]
    uses: ./.github/workflows/build-yc.yml
    with:
      image_tag: sha-${{ github.sha }}
    secrets:
      YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

  deploy:
    needs: [build]
    uses: ./.github/workflows/deploy-yc.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets:
      YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

  verify:
    needs: deploy
    uses: ./.github/workflows/verify.yml
    with:
      E2E_BASE_URL: ${{ vars.VITE_API_URL }}

  notify:
    needs: [checks, build, deploy, verify]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      checks_result: ${{ needs.checks.result }}
      build_result: ${{ needs.build.result }}
      deploy_result: ${{ needs.deploy.result }}
      verify_result: ${{ needs.verify.result }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
