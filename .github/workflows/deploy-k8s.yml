name: Deploy k8s

on:
  push:
    branches: [week*] # glob покроет week6..week8, не хардкодь [week6]

jobs:
  checks:
    uses: ./.github/workflows/pr-check.yaml

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.bp.outputs.image }}
      version: ${{ steps.bp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Login Docker Hub
        run: docker login -u ${{ vars.DOCKER_USER }} -p ${{ secrets.DOCKER_PASS }}
      - name: Build and push backend
        id: bp
        run: |
          IMAGE=${{ vars.DOCKER_USER }}/todo-back:sha-${{ github.sha }}
          docker build --platform linux/amd64 -t $IMAGE -t ${{ vars.DOCKER_USER }}/todo-back:latest back
          docker push $IMAGE
          docker push ${{ vars.DOCKER_USER }}/todo-back:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "version=sha-${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Deploy to k3s
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          envsubst < k8s/backend.yaml | kubectl apply -f -
          kubectl rollout status deployment/backend --timeout=120s

  notify:
    needs: [checks, build, deploy]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      checks_result: ${{ needs.checks.result }}
      build_result: ${{ needs.build.result }}
      deploy_result: ${{ needs.deploy.result }}
      verify_result: "success"

    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
