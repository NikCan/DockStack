name: Typecheck
 
on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
 
jobs:
  typecheck:
    name: typecheck (${{ inputs.service }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.service }}/package-lock.json
 
      - name: Install deps
        working-directory: ${{ inputs.service }}
        run: npm ci
 
      - name: Type-check
        working-directory: ${{ inputs.service }}
        run: npx tsc --noEmit