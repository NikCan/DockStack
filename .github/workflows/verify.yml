name: Verify Template

on:
  workflow_call:
    inputs:
      E2E_BASE_URL:
        type: string
        required: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Smoke
      env:
        E2E_BASE_URL: ${{ inputs.E2E_BASE_URL }}
      run: |
        # vars.VITE_API_URL у нас вида https://домен/api → отрежем /api
        E2E_BASE_URL="${E2E_BASE_URL%/api}" bash scripts/smoke.sh
