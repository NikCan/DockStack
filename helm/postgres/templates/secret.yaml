# Secret с кредами Postgres. Значения приходят из зашифрованного secrets.yaml
# (helm-secrets/SOPS расшифровывает их при деплое — локально и в ArgoCD repoServer).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  DB_USER: {{ .Values.secret.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
